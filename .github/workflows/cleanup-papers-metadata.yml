name: Clean stale paper metadata

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-papers-metadata.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'maintenance-hardening' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Remove obsolete migration header
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("data/papers.yaml")
          text = path.read_text(encoding="utf-8")
          stale = '''migration:
            complete_years: [2025, 2026]
            pending_years: [2019, 2020, 2021, 2022, 2023, 2024]
            note: "Initial structured-data migration. README remains the public source for pending years until they are migrated and validated."

          '''
          if stale not in text:
              raise SystemExit("Expected stale migration block not found")
          path.write_text(text.replace(stale, "", 1), encoding="utf-8")
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers.yaml
          git commit -m "Remove obsolete migration metadata"
          git push origin HEAD:${{ github.head_ref }}
