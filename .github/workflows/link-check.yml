name: Check links

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - ".github/workflows/link-check.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check documentation links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --root-dir "${{ github.workspace }}"
            --verbose
            --no-progress
            --max-retries 2
            --timeout 20
            --accept 200,202,206,403,429
            './README.md'
            './docs/**/*.md'
          fail: true
