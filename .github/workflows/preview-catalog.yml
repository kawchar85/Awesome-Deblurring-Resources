name: Preview generated catalog

on:
  pull_request:
    paths:
      - "data/**"
      - "scripts/generate_catalog.py"
      - ".github/workflows/preview-catalog.yml"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pyyaml
      - name: Validate structured data
        run: python scripts/validate_data.py
      - name: Generate preview
        run: python scripts/generate_catalog.py --output-dir generated-preview
      - name: Upload generated preview
        uses: actions/upload-artifact@v4
        with:
          name: generated-catalog-preview
          path: generated-preview/
          retention-days: 7
