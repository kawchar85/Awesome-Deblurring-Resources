name: Regenerate catalog after maintenance repairs

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/regenerate-catalog.yml"

permissions:
  contents: write

jobs:
  regenerate:
    if: github.head_ref == 'maintenance-hardening' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pyyaml
      - name: Validate structured data
        run: python scripts/validate_data.py
      - name: Generate catalog
        run: python scripts/generate_catalog.py --output-dir .
      - name: Commit generated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/by-task.md docs/by-signal.md docs/by-method.md
          if git diff --cached --quiet; then
            echo "Catalog already up to date."
            exit 0
          fi
          git commit -m "Regenerate catalog after link repairs"
          git push origin HEAD:${{ github.head_ref }}
