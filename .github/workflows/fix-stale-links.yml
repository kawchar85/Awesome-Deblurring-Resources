name: Fix stale canonical links

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fix-stale-links.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'maintenance-hardening' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Update canonical research links
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "data/papers-2024.yaml": {
                  "http://vi.kaist.ac.kr/2024/07/02/towards-real-world-event-guided-low-light-video-enhancement-and-deblurring/": "https://www.ecva.net/papers/eccv_2024/papers_ECCV/html/1982_ECCV_2024_paper.php",
                  "https://graphics.postech.ac.kr/researches/HCDeblur/": "https://arxiv.org/abs/2312.13317",
              },
              "data/papers.yaml": {
                  "https://github.com/KAISTVCLAB/gs-extreme-motion-blur": "https://github.com/KAIST-VCLAB/gs-extreme-motion-blur",
                  "https://github.com/Metalicana/Blind-Image-Deblurring-using-FFT-ReLU-with-Deep-Learning-Pipeline-Integration": "https://github.com/Metalicana/Blind-Image-Deblurring-with-FFT-ReLU-Sparsity-Prior",
              },
              "data/papers-2023.yaml": {
                  "https://github.com/xl-tang01/UAUDeblur": "https://github.com/xl-tang3/UAUDeblur",
              },
              "data/datasets.yaml": {
                  "https://abuolaim.nowaty.com/eccv_2020_dp_defocus_deblurring/": "https://github.com/Abdullah-Abuolaim/defocus-deblurring-dual-pixel",
                  "https://cg.postech.ac.kr/research/realblur/": "https://github.com/rimchang/RealBlur",
                  "https://cg.postech.ac.kr/research/rsblur/": "https://github.com/rimchang/RSBlur",
                  "https://github.com/KAISTVCLAB/gs-extreme-motion-blur": "https://github.com/KAIST-VCLAB/gs-extreme-motion-blur",
              },
          }

          for filename, mapping in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in mapping.items():
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{filename}: expected exactly one occurrence of {old!r}, found {count}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Commit link repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers.yaml data/papers-2024.yaml data/papers-2023.yaml data/datasets.yaml
          git commit -m "Repair stale canonical research links"
          git push origin HEAD:${{ github.head_ref }}
